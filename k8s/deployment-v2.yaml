apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketplace-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: marketplace-v2
  template:
    metadata:
      labels:
        app: marketplace-v2
    spec:
      containers:
        - name: marketplace
          image: mithra1707/marketplace:v2
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
